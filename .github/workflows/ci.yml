name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: npm test
      - name: No key or token literals
        run: |
          if git grep -nE "BEGIN (RSA )?PRIVATE KEY|ghs_[A-Za-z0-9]{20}|eyJ[A-Za-z0-9_-]{10,}\." -- . ':!tests/no-secrets.test.mjs'; then
            echo "::error::仓里出现了私钥或令牌形态的字面量"
            exit 1
          fi
